# On-demand SKU snapshot on a GitHub runner; commits data/ back to the repo.
# Run it from the Actions tab ("Run workflow") on any branch - or enable the
# cron below for scheduled runs (remember: schedules only fire from the
# repo's DEFAULT branch).
name: Scrape SKU counts

on:
  workflow_dispatch:
    inputs:
      product_cards:
        description: "Site key (e.g. fjellsport): crawl every product page and commit data/product_cards_<site>.csv instead of the SKU-count scrape"
        type: string
        default: ""
  # schedule:
  #   - cron: "17 5 * * 1"   # Mondays 05:17 UTC - uncomment to schedule

permissions:
  contents: write

concurrency: scrape-sku

jobs:
  scrape:
    runs-on: ubuntu-latest
    # The product-card crawl visits ~22k pages and needs more headroom.
    timeout-minutes: ${{ inputs.product_cards != '' && 240 || 45 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          if [ -z "${{ inputs.product_cards }}" ]; then
            playwright install --with-deps chromium
          fi

      - name: Scrape
        run: |
          if [ -n "${{ inputs.product_cards }}" ]; then
            python product_cards.py "${{ inputs.product_cards }}"
          else
            python main.py
          fi

      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No data changes to commit"
          else
            if [ -n "${{ inputs.product_cards }}" ]; then
              git commit -m "Product cards ${{ inputs.product_cards }} $(date -u +%F)"
            else
              git commit -m "SKU counts $(date -u +%F)"
            fi
            git push
          fi
